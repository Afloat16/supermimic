[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "supermimic"
version = "0.1.0"
description = "SuperTrack implementation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mjlab",
    "ruff>=0.14.10",
    "viser>=1.0.24",
]

[tool.uv.sources]
mjlab = { path = "../mjlab_research", editable = true }

[tool.ruff]
src = ["src"]
indent-width = 2
exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pre-commit>=4.2.0",
    "pytest>=9.0.2",
]
