[build-system]
requires = ["uv_build>=0.8.19"]
build-backend = "uv_build"

[project]
name = "supermimic"
version = "0.1.0"
description = "SuperTrack implementation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mjlab",
    "ruff>=0.14.10",
]

[tool.uv.sources]
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "7c20a44bfed722e6415235792a1b247ea6b6a6d3"}
mjlab = { path = "../mjlab_research", editable = true }

[tool.ruff]
src = ["src"]
indent-width = 2
exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]
